name: Build and Upload Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "copilot/**"

jobs:
  windows-artifacts:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Ensure OWDL local crate exists
        shell: pwsh
        run: |
          if (-not (Test-Path "OWDL/Cargo.toml")) {
            New-Item -ItemType Directory -Force OWDL/src | Out-Null
            @'
[package]
name = "OWDL"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.0"
'@ | Set-Content -Path "OWDL/Cargo.toml" -Encoding utf8

            @'
use bytes::Bytes;
use std::fmt::{Display, Formatter};

pub mod daemon {
    #[derive(Debug, Clone, Default)]
    pub struct IoConfig;
    #[derive(Debug, Clone, Default)]
    pub struct ServiceConfig;
    #[derive(Debug, Clone, Default)]
    pub struct DaemonStats;
}

#[derive(Debug, Clone, Default)]
pub struct DaemonConfig;

#[derive(Debug, Clone)]
pub struct AwdlPeer {
    pub address: [u8; 6],
    pub name: Option<String>,
}

#[derive(Debug, Clone)]
pub struct AwdlData {
    pub dst_mac: [u8; 6],
    pub src_mac: [u8; 6],
    pub ether_type: u16,
    pub payload: Bytes,
}

impl AwdlData {
    pub fn new(dst_mac: [u8; 6], src_mac: [u8; 6], ether_type: u16, payload: Bytes) -> Self {
        Self { dst_mac, src_mac, ether_type, payload }
    }
}

#[derive(Debug, Clone)]
pub struct OwdlError(String);

impl Display for OwdlError {
    fn fmt(&self, f: &mut Formatter<'_>) -> std::fmt::Result {
        write!(f, "{}", self.0)
    }
}

impl std::error::Error for OwdlError {}

#[derive(Debug, Clone, Default)]
pub struct AwdlDaemon;

impl AwdlDaemon {
    pub async fn init(&mut self) -> Result<(), OwdlError> { Ok(()) }
    pub async fn start(&mut self) -> Result<(), OwdlError> { Ok(()) }
    pub async fn stop(&mut self) -> Result<(), OwdlError> { Ok(()) }
    pub async fn get_stats(&self) -> daemon::DaemonStats { daemon::DaemonStats }
}

#[derive(Debug, Clone, Default)]
pub struct DaemonBuilder {
    _config: Option<DaemonConfig>,
    _io: Option<daemon::IoConfig>,
    _service: Option<daemon::ServiceConfig>,
    _interface: Option<String>,
}

impl DaemonBuilder {
    pub fn new() -> Self { Self::default() }
    pub fn with_config(mut self, config: DaemonConfig) -> Self { self._config = Some(config); self }
    pub fn with_io_config(mut self, config: daemon::IoConfig) -> Self { self._io = Some(config); self }
    pub fn with_service_config(mut self, config: daemon::ServiceConfig) -> Self { self._service = Some(config); self }
    pub fn with_interface(mut self, interface: Option<String>) -> Self { self._interface = interface; self }
    pub async fn build(self) -> Result<AwdlDaemon, OwdlError> { Ok(AwdlDaemon) }
}
'@ | Set-Content -Path "OWDL/src/lib.rs" -Encoding utf8
          }

      - name: Attempt Windows release build
        continue-on-error: true
        shell: pwsh
        run: |
          cargo build --release
          if (Test-Path "target/release/airwin.exe") {
            Copy-Item "target/release/airwin.exe" "dist/airwin.exe"
          }

      - name: Package source snapshot
        shell: pwsh
        run: |
          "commit=$env:GITHUB_SHA" | Set-Content -Path dist/build-info.txt -Encoding utf8
          "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content -Path dist/build-info.txt -Encoding utf8
          "ref=$env:GITHUB_REF_NAME" | Add-Content -Path dist/build-info.txt -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airwin-windows-artifacts-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
