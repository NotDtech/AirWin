name: Build and Upload Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "copilot/**"

jobs:
  artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare artifact directory
        run: mkdir -p dist

      - name: Attempt build
        continue-on-error: true
        run: |
          cargo build --release
          if [ -f target/release/airwin ]; then
            cp target/release/airwin dist/airwin-linux
          fi

      - name: Package source snapshot
        run: |
          tar --exclude=.git --exclude=target -czf dist/airwin-source.tar.gz .
          echo "commit=${GITHUB_SHA}" > dist/build-info.txt
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> dist/build-info.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airwin-artifacts-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
